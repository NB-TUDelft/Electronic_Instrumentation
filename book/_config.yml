# Book Settings
title: "NB2420 practical manuals"
author: Margreet Docter, Jeroen Bastemeijer, Ashley Jacobi, Krzysztof Zabłocki <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer"">CC BY 4.0<img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt=""><img style="height:22px!important;margin-left:3px;vertical-align:text-bottom;" src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt=""></a>
description: "Collection of practical manuals for the NB2420 course"
copyright: "Delft University of Technology, CC BY 4.0"
exclude_patterns: [_build, Thumbs.db, .DS_Store, "**.ipynb_checkpoints", .conda/**, .mamba/**, .venv/**]

# Only build files in the ToC to avoid building README, etc.
only_build_toc_files: true


#######################################################################################
# Execution settings
execute:
  execute_notebooks: off
  cache: ""
  timeout: 300
  run_in_temp: false
  allow_errors: false
  stderr_output: show

#######################################################################################
# Parse and render settings
parse:
  myst_enable_extensions:
    - amsmath
    - colon_fence # To allow for ::: instead of ``` blocks.
    - deflist
    - dollarmath
    - html_admonition
    - html_image
    - linkify
    - replacements
    - smartquotes
    - substitution
    - tasklist
  myst_url_schemes: [ mailto, http, https ]
  myst_dmath_double_inline: true


#######################################################################################
# HTML-specific settings
html:
  favicon: "static/icons/favicon.svg"
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true
  extra_navbar: "" # Change this parameter (optional)
  extra_footer: "" # Change this parameter (optional)
  google_analytics_id: ""
  home_page_in_navbar: true
  baseurl: "https://nb-tudelft.github.io/Electronic_Instrumentation/"
  comments:
    hypothesis: true
    utterances: false
  announcement: "" # Change this parameter (optional)
  use_multitoc_numbering: false
  extra_css: []


#######################################################################################
# Information about where the book exists on the web
repository:
  url: https://github.com/NB-TUDelft/Electronic_Instrumentation 
  path_to_book: "book" 
  branch: main


#######################################################################################
# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib


#######################################################################################
# Advanced and power-user settings
sphinx:
  extra_extensions: 
    - sphinx.ext.imgconverter 
    - jupyterbook_patches 
    - download_link_replacer 
    - sphinx.ext.extlinks 
    - sphinx_image_inverter 
    - sphinx_iframes 
    - sphinx_exercise 
    - teachbooks_sphinx_tippy 

  recursive_update: false

  config:
    iframe_blend:          true # default value
    iframe_saturation:     1.5 # default value
    iframe_h5p_autoresize: true # default value
    iframe_background:     "#ffffff" # default value
    iframe_width:          calc(100% - 2.8rem) # default value
    iframe_aspectratio:    auto 2 / 1 # default value
    exclude_patterns: [.conda/**, .mamba/**, _build/**, "**/.ipynb_checkpoints", .venv/**]
    html_extra_path: []
    language: en  # To identify the language. Change if appropriate
    html_js_files: 
    - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js 
    - warning.js 
    html_static_path:
    - "static"
    thebe_config: 
      use_thebe_lite: true 
      exclude_patterns: ["**/_*.yml", "**/*.md", "**/*.ipynb"] 
    html_theme_options: 
      logo:
        text: NB2420 practical
        image_light: static/icons/alpaca.svg
        image_dark: static/icons/alpaca.svg
      repository_url: https://github.com/NB-TUDelft/Electronic_Instrumentation
      repository_branch: main
      path_to_docs: "book" 
      use_edit_page_button: false 
      use_repository_button: true 
      use_issues_button : true 
      launch_buttons: 
        thebe: true 
    html_show_copyright: true
    html_last_updated_fmt: '%B %-d, %Y' 
    mathjax3_config: 
      chtml: { 
        mtextInheritFont: true # To typeset text within math prettier 
      } 
