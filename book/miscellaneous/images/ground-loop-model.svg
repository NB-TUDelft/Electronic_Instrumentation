<title id="title">Resistance model of a ground loop</title>
<desc id="desc">Reference nodes G_s and G_m connect through resistance R_g in the upper path. A second path contains R_other and an equivalent driving voltage U_loop. The voltage source is positive toward G_s, so the loop current goes from G_s to G_m through R_g.</desc>

