   <style>
      #star,
      #triangle {
         transform-box: fill-box;
         transform-origin: center;
      }

      #star {
         animation: show-star 6s ease-in-out infinite;
      }

      #triangle {
         opacity: 0;
         animation: show-triangle 6s ease-in-out infinite;
      }

      @keyframes show-star {
         0%,
         42%,
         100% {
            opacity: 1;
         }

         50%,
         92% {
            opacity: 0;
         }
      }

      @keyframes show-triangle {
         0%,
         42%,
         100% {
            opacity: 0;
         }

         50%,
         92% {
            opacity: 1; 
         }
      }

      @media (prefers-reduced-motion: reduce) {
         #star,
         #triangle {
            animation: none;
            transform: none;
         }

         #star {
            opacity: 1;
         }

         #triangle {
            opacity: 0;
         }
      }
   </style>
