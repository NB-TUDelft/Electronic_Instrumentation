    <dc:title>Comparator input and output</dc:title>
    <dc:date>2026-10-15T02:58:38.762744</dc:date>
    <dc:description>An ideal non-inverting comparator receives a sine-wave input and a zero reference at its negative input. The output is high for positive input and low for negative input. Aligned time axes and dotted guides show the switching moments.</dc:description>
