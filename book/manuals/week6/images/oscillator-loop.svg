<title id="title">Two-stage relaxation oscillator</title>
<desc id="desc">OA1 is an inverting integrator. OA2 is a non-inverting Schmitt trigger. Ra carries the triangle to OA2, Rb supplies positive feedback, and Rc carries the comparator output to the integrator.</desc>
