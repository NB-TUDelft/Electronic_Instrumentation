<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 515" role="img" aria-labelledby="title desc">
<title id="title">Two-stage relaxation oscillator</title>
<desc id="desc">OA1 is an inverting integrator. OA2 is a non-inverting Schmitt trigger. Ra carries the triangle to OA2, Rb supplies positive feedback, and Rc carries the comparator output to the integrator. Dashed boxes identify the integrator, comparator, and feedback line.</desc>
