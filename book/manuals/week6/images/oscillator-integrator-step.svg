 <title>Inverting integrator response to a positive step</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Inverting integrator response to a positive step</dc:title>
    <dc:date>2026-10-15T04:22:30.581666</dc:date>
    <dc:description>Qualitative illustration with initially zero output. A positive input step U0 at t0 gives an output ramp of slope -U0/(Rc C). It reaches the lower output limit UL at tsat and then remains saturated. The ramp duration is Rc C abs(UL)/U0.</dc:description>
