# Tells the logbook site (NB-TUDelft/EI_Logbooks) that a logbook changed here,
# so it copies the templates and rebuilds the PDFs within minutes instead of
# at its next hourly check. It changes nothing in this repository and does not
# touch the book.
#
# Needs one repository secret, LOGBOOKS_DISPATCH_TOKEN: a fine-grained token
# for NB-TUDelft with access to EI_Logbooks only, permission
# "Contents: Read and write". Without the secret it does nothing, and the site
# still picks up the change at its next hourly check.
name: tell the logbook site
on:
  push:
    branches: [main]
    paths:
      - 'book/manuals/**/*_logbook.typ'
      - 'book/manuals/logbook_common.typ'
  workflow_dispatch:
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Ask EI_Logbooks to copy the logbooks
        env:
          GH_TOKEN: ${{ secrets.LOGBOOKS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No LOGBOOKS_DISPATCH_TOKEN secret; the logbook site picks this up at its next hourly check."
            exit 0
          fi
          gh api repos/NB-TUDelft/EI_Logbooks/dispatches \
            -f event_type=book-logbooks-changed \
            -f "client_payload[commit]=$GITHUB_SHA"
