name: call-deploy-book
# Builds and publishes the book, in three steps that depend on each other:
#
#   logbook-check ──> notify-logbooks (main only) ──> call-workflow (build and publish)
#
# 1. logbook-check runs the logbook site's own check on book/manuals: every log
#    book entry's name, week folder, imports, no two with one number, and that
#    it compiles the way the site builds it. The Log book menu links each entry
#    to the logbook site (NB-TUDelft/EI_Logbooks), which refuses a broken one,
#    so nothing below runs until the entries are fine.
# 2. notify-logbooks, on main only, tells the logbook site to copy the entries
#    now, so a new entry is there before the book's menu links to it. It needs
#    the repository secret LOGBOOKS_DISPATCH_TOKEN (a fine-grained token with
#    access to EI_Logbooks only, "Contents: Read and write"); without it the
#    site picks the change up at its nightly run.
# 3. call-workflow builds and publishes the book, as before.
#
# It runs on all branches to include development versions too.
on:
  push:
    branches:
    - "**"
    # Only run when book or dependency files change (or this workflow itself)
    paths:
    - book/**
    - requirements.txt
    - .github/workflows/call-deploy-book.yml
  # Allow manual runs from the GitHub UI
  workflow_dispatch:

jobs:
  logbook-check:
    name: Check the log book entries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: book/manuals
      - name: Install the Typst renderer
        run: python3 -m pip install --quiet "sphinx-typst-render>=0.2.5"
      - name: Run the logbook site's own check
        run: |
          curl -fsSL https://raw.githubusercontent.com/NB-TUDelft/EI_Logbooks/main/tools/sync_templates.py \
            -o "$RUNNER_TEMP/sync_templates.py"
          python3 "$RUNNER_TEMP/sync_templates.py" --check --compile .

  notify-logbooks:
    name: Tell the logbook site
    needs: logbook-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask EI_Logbooks to copy the entries
        env:
          GH_TOKEN: ${{ secrets.LOGBOOKS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::No LOGBOOKS_DISPATCH_TOKEN secret; the logbook site picks this up at its nightly run."
            exit 0
          fi
          gh api repos/NB-TUDelft/EI_Logbooks/dispatches \
            -f event_type=book-logbooks-changed \
            -f "client_payload[commit]=$GITHUB_SHA"

  call-workflow:
    needs: [logbook-check, notify-logbooks]
    # notify-logbooks is skipped on other branches; build anyway once the check passed.
    if: >-
      always() && needs.logbook-check.result == 'success' &&
      (needs.notify-logbooks.result == 'success' || needs.notify-logbooks.result == 'skipped')
    # Reuse the standard TeachBooks deploy workflow to build and publish the book
    uses: TeachBooks/deploy-book-workflow/.github/workflows/deploy-book.yml@main
    # Pass repository secrets through to the called workflow
    secrets: inherit
    permissions:
      # Required to read repository content (e.g., during checkout)
      contents: read
      # Required to publish to GitHub Pages
      pages: write
      # Required for OIDC authentication during Pages deployment
      id-token: write
